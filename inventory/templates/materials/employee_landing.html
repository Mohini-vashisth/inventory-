<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      color: white;
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: rgba(255,255,255,0.8);
      font-size: 1rem;
      margin-bottom: 3rem;
    }

    .cards {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card-link {
      text-decoration: none;
    }

    .card {
      background: white;
      width: 220px;
      padding: 2.5rem 1.5rem;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .card h2 {
      color: #333;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: #888;
      font-size: 0.82rem;
      line-height: 1.4;
    }

    .back-link {
      display: inline-block;
      margin-top: 2.5rem;
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
      text-decoration: none;
    }

    .back-link:hover {
      color: white;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>Employee Portal</h1>
  <p class="subtitle">What would you like to do?</p>

  <div class="cards">

    <a href="{% url 'material_form' %}" class="card-link">
      <div class="card">
        <div class="icon">📦</div>
        <h2>New Coil Entry</h2>
        <p>Register a newly received coil into the inventory</p>
      </div>
    </a>

    <a href="{% url 'select_order' %}" class="card-link">
      <div class="card">
        <div class="icon">✂️</div>
        <h2>Create New Part</h2>
        <p>Log a part cut from an existing coil</p>
      </div>
    </a>

    <a href="{% url 'production_board' %}" class="card-link">
      <div class="card">
        <div class="icon">🔄</div>
        <h2>Update Progress</h2>
        <p>See current orders and update manufacturing step status</p>
      </div>
    </a>

  </div>

  <a href="{% url 'home' %}" class="back-link">← Back to home</a>

</div>


</body>
</html>
