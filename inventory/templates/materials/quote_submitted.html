<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Request Submitted</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .icon { font-size: 3.5rem; margin-bottom: 1rem; }
    h1 { color: #166534; font-size: 1.4rem; margin-bottom: 0.5rem; }
    p  { color: #555; font-size: 0.95rem; line-height: 1.6; }
    .company { font-weight: 600; color: #333; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon">✅</div>
  <h1>Request Submitted!</h1>
  <p>
    Thank you, <span class="company">{{ customer.name }}</span>.<br>
    Your quotation request has been received and is under review. We will get back to you shortly.
  </p>
</div>
</body>
</html>
