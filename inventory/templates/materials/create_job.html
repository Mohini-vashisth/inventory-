<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Job – {{ part.part_no }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .back-link {
      color: #4e73df;
      text-decoration: none;
      font-size: 0.85rem;
      display: inline-block;
      margin-bottom: 1.25rem;
    }
    .back-link:hover { text-decoration: underline; }

    h1 {
      font-size: 1.2rem;
      color: #333;
      margin-bottom: 0.4rem;
    }

    .meta {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 1.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 1.1rem;
    }

    .form-group label {
      font-size: 0.78rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .form-group select,
    .form-group textarea {
      padding: 0.6rem 0.75rem;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
    }

    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4e73df;
    }

    .step-preview {
      background: #f9fafb;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      color: #555;
      display: none;
    }

    .step-preview.visible { display: block; }

    .step-preview strong {
      display: block;
      color: #333;
      margin-bottom: 0.4rem;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .step-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .step-list li {
      background: #dbeafe;
      color: #1e40af;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      background: #1cc88a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-submit:hover { opacity: 0.88; }
  </style>
</head>
<body>
<div class="card">

  <a href="{% url 'coil_parts' part.coil.coil_no %}" class="back-link">
    ← Back to parts for {{ part.coil.formatted_coil }}
  </a>

  <h1>Create production job</h1>
  <p class="meta">Part: <strong>{{ part.part_no }}</strong></p>

  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label>Product type</label>
      <select name="product_type" id="pt-select" required>
        <option value="">— select a product type —</option>
        {% for pt in product_types %}
        <option value="{{ pt.pk }}" data-steps="{% for s in pt.steps.all %}{{ s.name }}|{% endfor %}">
          {{ pt.name }}
        </option>
        {% endfor %}
      </select>
    </div>

    <!-- Shows steps for the selected product type -->
    <div class="step-preview" id="step-preview">
      <strong>Steps that will be created</strong>
      <ul class="step-list" id="step-list"></ul>
    </div>

    <div class="form-group">
      <label>Notes (optional)</label>
      <textarea name="notes" rows="3" placeholder="Any additional notes..."></textarea>
    </div>

    <button type="submit" class="btn-submit">Create Job</button>
  </form>

</div>

<script>
  document.getElementById('pt-select').addEventListener('change', function () {
    const opt = this.options[this.selectedIndex];
    const steps = opt.dataset.steps || '';
    const preview = document.getElementById('step-preview');
    const list = document.getElementById('step-list');

    if (!steps) {
      preview.classList.remove('visible');
      return;
    }

    const names = steps.split('|').filter(Boolean);
    list.innerHTML = names.map(function(n, i) {
      return '<li>' + (i + 1) + '. ' + n + '</li>';
    }).join('');
    preview.classList.add('visible');
  });
</script>

</body>
</html>
