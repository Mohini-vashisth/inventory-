<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #4e73df, #1cc88a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .box {
      background: white;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    h1 { color: #333; font-size: 1.3rem; margin-bottom: 0.3rem; }
    p  { color: #888; font-size: 0.85rem; margin-bottom: 1.75rem; }
    input[type="password"] {
      width: 100%; padding: 0.7rem 1rem;
      border: 1px solid #ddd; border-radius: 10px;
      font-size: 1.1rem; letter-spacing: 0.3em;
      text-align: center; margin-bottom: 1rem;
    }
    input[type="password"]:focus { outline: none; border-color: #4e73df; }
    button {
      width: 100%; padding: 0.75rem;
      background: #4e73df; color: white;
      border: none; border-radius: 10px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #3a5ec0; }
    .error {
      background: #fee2e2; color: #991b1b;
      border-radius: 8px; padding: 0.5rem 0.75rem;
      font-size: 0.85rem; margin-bottom: 1rem;
    }
    .back { display: inline-block; margin-top: 1.25rem; color: #aaa; font-size: 0.82rem; text-decoration: none; }
    .back:hover { color: #4e73df; }
  </style>
</head>
<body>
<div class="box">
  <div class="icon">👷</div>
  <h1>Employee Portal</h1>
  <p>Enter your PIN to continue</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <input type="password" name="pin" placeholder="••••" autofocus autocomplete="off">
    <button type="submit">Enter</button>
  </form>

  <a href="{% url 'home' %}" class="back">← Back to home</a>
</div>
</body>
</html>
