<div class="item-row" data-item-row>
  {% for hidden in form.hidden_fields %}{{ hidden }}{% endfor %}
  <span hidden>{{ form.DELETE }}</span>
  <div class="item-row-head">
    <b class="item-number">Product</b>
    <button type="button" class="icon-btn red" data-remove-item>✕ Remove</button>
  </div>
  <div class="form-row cols-2">
    <div class="form-group"><label>Product Type</label>{{ form.product_category }}</div>
    <div class="form-group"><label>Product Code</label>{{ form.product_type }}<span class="code-hint muted"></span></div>
  </div>
  <div class="form-row cols-3">
    <div class="form-group"><label>Grade</label>{{ form.grade }}</div>
    <div class="form-group"><label>Width (mm)</label>{{ form.width }}</div>
    <div class="form-group"><label>Thickness (mm)</label>{{ form.thickness }}</div>
  </div>
  <div class="form-row cols-2">
    <div class="form-group"><label>Quantity (kg)</label>{{ form.quantity }}</div>
    <div class="form-group"><label>Delivery Form</label>{{ form.delivery_form }}</div>
  </div>
</div>
