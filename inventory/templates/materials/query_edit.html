<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Query</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, Helvetica, sans-serif; background: #f4f6f9; color: #333; }

    header {
      background: #4e73df; color: white;
      padding: 1rem 2rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { font-size: 1.3rem; }
    .back-link { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.9rem; margin-left: 1.25rem; }
    .back-link:hover { color: white; }

    .content { max-width: 700px; margin: 2rem auto; padding: 0 1.5rem; }

    .card {
      background: white; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      overflow: hidden;
    }
    .card-header {
      padding: 1rem 1.5rem; border-bottom: 1px solid #f0f0f0;
      font-size: 1rem; font-weight: 600;
    }
    .card-body { padding: 1.75rem; }

    .form-row { display: grid; gap: 0.75rem; margin-bottom: 0.75rem; }
    .cols-2 { grid-template-columns: 1fr 1fr; }

    .form-group { display: flex; flex-direction: column; }
    label {
      font-size: 0.72rem; color: #888; margin-bottom: 0.3rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
    }
    input, select, textarea {
      padding: 0.55rem 0.75rem; border: 1px solid #ddd;
      border-radius: 8px; font-size: 0.9rem; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4e73df; }

    .submit-row { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1rem; }
    .btn-primary {
      padding: 0.65rem 2rem; background: #4e73df; color: white;
      border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
    }
    .btn-primary:hover { background: #3a5ec0; }
    .btn-secondary {
      padding: 0.65rem 1.5rem; background: white; color: #666;
      border: 1px solid #ddd; border-radius: 8px; font-size: 0.95rem;
      cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-secondary:hover { background: #f8f9fb; }

    .error-msg {
      background: #fee2e2; color: #991b1b;
      padding: 0.6rem 0.9rem; border-radius: 8px;
      font-size: 0.87rem; margin-bottom: 1rem;
    }

    @media (max-width: 640px) {
      header { padding: 1rem; flex-wrap: wrap; gap: 0.5rem; }
      .content { padding: 0 0.85rem; margin: 1rem auto; }
      .card-body { padding: 1.1rem; }
      .cols-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>Edit Query</h1>
  <div>
    <a href="{% url 'query_dashboard' %}" class="back-link">← Back to Query Dashboard</a>
  </div>
</header>

<div class="content">
  <div class="card">
    <div class="card-header">{{ query.company_name|default:query.contact_phone }}</div>
    <div class="card-body">
      {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}

      <form method="post">
        {% csrf_token %}

        <div class="form-row cols-2">
          <div class="form-group">
            <label>Company / Contact Name</label>
            <input type="text" name="company_name" value="{{ query.company_name }}">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" name="contact_phone" value="{{ query.contact_phone }}">
          </div>
        </div>

        <div class="form-row cols-2">
          <div class="form-group">
            <label>Email</label>
            <input type="email" name="contact_email" value="{{ query.contact_email }}">
          </div>
          <div class="form-group">
            <label>Product Type</label>
            <select name="product_type">
              <option value="">— none —</option>
              {% for pt in product_types %}
              <option value="{{ pt.pk }}" {% if query.product_type_id == pt.pk %}selected{% endif %}>
                {{ pt.item_code }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="form-row cols-2">
          <div class="form-group">
            <label>Grade</label>
            <input type="text" name="grade" value="{{ query.grade }}">
          </div>
          <div class="form-group">
            <label>Size (mm)</label>
            <input type="number" name="size" step="0.001" min="0" value="{{ query.size|default:'' }}">
          </div>
        </div>

        <div class="form-row cols-2">
          <div class="form-group">
            <label>Quantity (kg)</label>
            <input type="number" name="quantity" step="0.001" min="0" value="{{ query.quantity|default:'' }}">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Notes</label>
            <textarea name="notes" rows="4">{{ query.notes }}</textarea>
          </div>
        </div>

        <div class="submit-row">
          <a href="{% url 'query_dashboard' %}" class="btn-secondary">Cancel</a>
          <button type="submit" class="btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
