name = "matta-whatsapp-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["* * * * *"]   # every minute: replay anything queued while the PC was off

[vars]
# The app's public webhook (the Tailscale Funnel address) — where messages are passed on to.
PC_WEBHOOK_URL = "https://mdw.tail2734e7.ts.net/webhooks/whatsapp/"
# The numeric id of the WhatsApp number (App Dashboard -> WhatsApp -> API Setup), same as the app's
# WHATSAPP_PHONE_NUMBER_ID.
PHONE_NUMBER_ID = "REPLACE_WITH_WHATSAPP_PHONE_NUMBER_ID"
# Optional: ACK_TEXT = "..."   ACK_COOLDOWN_SECONDS = 21600   MAX_QUEUE_AGE_SECONDS = 604800

[[d1_databases]]
binding = "DB"
database_name = "whatsapp-relay"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
